name: Daily Market Data Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 1-5"

permissions:
  id-token: write
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-ingestion.txt

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify S3 connectivity
        run: aws s3 ls "s3://${{ vars.S3_BUCKET }}/${{ vars.S3_PREFIX }}/"

      - name: Install ingestion dependencies
        working-directory: backend
        run: python -m pip install -r requirements-ingestion.txt

      - name: Run incremental market-data refresh
        working-directory: backend
        env:
          STORAGE_MODE: s3
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PREFIX: ${{ vars.S3_PREFIX }}
          DEFAULT_START_DATE: "2016-01-01"
        run: python -m app.data.ingestion
