name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: portfolioiq-backend-production
  cancel-in-progress: false

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Run backend regression suite
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          pytest
      - name: Configure deployment credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: PortfolioIQBackendDeploy
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push immutable backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
      - name: Deploy ECS Express Mode service
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ vars.ECS_EXPRESS_SERVICE }}
          image: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          execution-role-arn: ${{ vars.ECS_TASK_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ vars.ECS_INFRASTRUCTURE_ROLE_ARN }}
          task-role-arn: ${{ vars.ECS_RUNTIME_ROLE_ARN }}
          container-port: "8000"
          cpu: "1024"
          memory: "2048"
          health-check-path: /health
          min-task-count: "1"
          max-task-count: "2"
          auto-scaling-metric: AVERAGE_CPU
          auto-scaling-target-value: "70"
          environment-variables: |
            [
              {"name":"APP_ENV","value":"production"},
              {"name":"PORT","value":"8000"},
              {"name":"STORAGE_MODE","value":"s3"},
              {"name":"AWS_REGION","value":"${{ vars.AWS_REGION }}"},
              {"name":"S3_BUCKET","value":"${{ vars.S3_BUCKET }}"},
              {"name":"S3_PREFIX","value":"${{ vars.S3_PREFIX }}"},
              {"name":"CORS_ALLOWED_ORIGINS","value":"${{ vars.CORS_ALLOWED_ORIGINS }}"}
            ]
          tags: |
            Project=PortfolioIQ
            Environment=Production
